<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carga de juicio — MR & Asociados</title>
<style>
:root{--navy:#1F4E79;--celeste:#5DADE2;--fondo:#F5F7FA;--card:#fff;--borde:#E6EAF0;--texto:#1E293B;--suave:#64748B;--verde:#1E9E6A}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--fondo);color:var(--texto)}
.wrap{max-width:680px;margin:0 auto;padding:18px}
.top{background:var(--navy);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.top h1{margin:0 0 4px;font-size:18px}.top p{margin:0;opacity:.85;font-size:13px}
.badge{display:inline-block;background:rgba(255,255,255,.15);border-radius:8px;padding:3px 10px;font-size:12px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--suave);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:9px;font-size:15px;background:#fff;color:var(--texto)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--celeste);box-shadow:0 0 0 3px rgba(93,173,226,.15)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px}.row>div{flex:1}
button{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
button:hover{background:#2E6DA4}button:disabled{background:#9db4cc}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;display:none}
.ok{background:#E8F7F0;color:var(--verde);border:1px solid #BFE8D6}
.err{background:#FDECEC;color:#D64545;border:1px solid #F0C4C4}
.foot{text-align:center;color:var(--suave);font-size:12px;padding:10px}
.req{color:#D64545}
.prev{display:block;font-size:12px;color:var(--suave);margin-top:4px;min-height:15px}
.prev.mal{color:#D64545}
</style></head><body>
<div class="wrap">
  <div class="top">
    <h1>⚖️ Carga de juicio</h1>
    <p id="sub">Completá los datos del expediente. Al guardar, la información llega directo al estudio.</p>
    <div class="badge" id="emp">Cargando…</div>
  </div>
  <div id="msg" class="msg"></div>
  <div class="card" id="form" style="display:none">
    <div id="empresa_wrap" style="display:none">
      <label>Empresa <span class="req">*</span></label>
      <select id="empresa_id"></select>
    </div>
    <label>Actor (Apellido y Nombre) <span class="req">*</span></label>
    <input id="actor">
    <div class="row">
      <div><label>Categoría</label><select id="categoria"></select></div>
      <div><label>Año</label><input id="anio" type="number" inputmode="numeric"></div>
    </div>
    <label>Estado / Etapa procesal</label><select id="etapa"></select>
    <div class="row">
      <div><label>Nº Expediente</label><input id="nro_expediente"></div>
      <div><label>Prob. de pérdida</label><select id="prob_perdida"></select></div>
    </div>
    <label>Juzgado / Fuero</label><input id="juzgado">
    <div class="row">
      <div><label>Monto demandado ($)</label><input id="monto_demandado" class="monto" inputmode="decimal" placeholder="Ej: 1.500.000,50"><small class="prev" id="prev_monto_demandado"></small></div>
      <div><label>Intereses de sentencia ($)</label><input id="intereses_sentencia" class="monto" inputmode="decimal"><small class="prev" id="prev_intereses_sentencia"></small></div>
    </div>
    <div class="row">
      <div><label>Ofrecimiento ($)</label><input id="ofrecimiento" class="monto" inputmode="decimal"><small class="prev" id="prev_ofrecimiento"></small></div>
      <div><label>Monto acordado ($)</label><input id="monto_acordado" class="monto" inputmode="decimal"><small class="prev" id="prev_monto_acordado"></small></div>
    </div>
    <label>Abogado patrocinante</label><input id="abogado">
    <label>Notas</label><textarea id="notas"></textarea>
    <button id="save">Guardar</button>
  </div>
  <div class="foot">MR &amp; Asociados — Control de Juicios</div>
</div>
<script>
var FN = "https://zpwccecovhjmeibxafkg.supabase.co/functions/v1/juicio-abogado";
var P = new URLSearchParams(location.search);
var TOKEN = P.get("token") || "";
var NUEVO = P.get("nuevo") || "";  // clave del formulario de alta
function el(id){return document.getElementById(id)}
function showMsg(txt, ok){var m=el("msg");m.textContent=txt;m.className="msg "+(ok?"ok":"err");m.style.display="block"}
function opts(sel, arr, val){
  sel.innerHTML="";
  for(var i=0;i<arr.length;i++){var o=document.createElement("option");o.value=arr[i];o.textContent=arr[i];sel.appendChild(o)}
  if(val){sel.value=val}
}
var CAMPOS=["actor","categoria","anio","etapa","nro_expediente","prob_perdida","juzgado","monto_demandado","intereses_sentencia","ofrecimiento","monto_acordado","abogado","notas"];
var MONTOS=["monto_demandado","intereses_sentencia","ofrecimiento","monto_acordado"];

// Lee un monto escrito a la argentina: "1.500.000,50", "1500000,50", "1.500" (=1500),
// "1500.50" (decimal con punto). Devuelve null si está vacío y NaN si no se entiende.
function leerMonto(s){
  s=String(s||"").replace(/[\s$]/g,"");
  if(s==="") return null;
  if(!/^[\d.,]+$/.test(s)) return NaN;
  var ent=s, dec="";
  if(s.indexOf(",")>=0){
    var p=s.split(","); if(p.length>2) return NaN;
    ent=p[0]; dec=p[1];
    if(ent.indexOf(".")>=0 && !/^\d{1,3}(\.\d{3})+$/.test(ent)) return NaN;
    ent=ent.replace(/\./g,"");
  } else if(s.indexOf(".")>=0){
    var d=s.split(".");
    if(d.length>2 || /^\d{1,3}\.\d{3}$/.test(s)){     // puntos de miles
      if(!/^\d{1,3}(\.\d{3})+$/.test(s)) return NaN;
      ent=s.replace(/\./g,"");
    } else { ent=d[0]; dec=d[1]; }                     // punto decimal
  }
  if(!/^\d+$/.test(ent) || !/^\d{0,2}$/.test(dec)) return NaN;
  return Math.round(parseFloat(ent+"."+(dec||"0"))*100)/100;
}
function fmtMonto(n){
  return n.toLocaleString("es-AR",{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
}
function verMonto(k){
  var v=leerMonto(el(k).value), p=el("prev_"+k);
  if(v===null){p.textContent="";p.className="prev"}
  else if(isNaN(v)){p.textContent="⚠ No se entiende el monto (ej: 1.500.000,50)";p.className="prev mal"}
  else {p.textContent="Se guarda: $ "+fmtMonto(v);p.className="prev"}
}
for(var m=0;m<MONTOS.length;m++){(function(k){el(k).addEventListener("input",function(){verMonto(k)})})(MONTOS[m])}

function llenarCat(cat){
  opts(el("categoria"), cat.categorias, "");
  opts(el("etapa"), cat.etapas, "");
  opts(el("prob_perdida"), [""].concat(cat.probs), "");
}

function modoEditar(){
  fetch(FN+"?data=1&token="+encodeURIComponent(TOKEN)).then(function(r){return r.json()}).then(function(d){
    if(d.error){showMsg("No se pudo abrir el juicio: "+d.error,false);return}
    var j=d.juicio;
    el("emp").textContent="Empresa: "+d.empresa+"  ·  Juicio Nº "+(j.nro||"-");
    llenarCat(d.catalogos);
    el("categoria").value=j.categoria||""; el("etapa").value=j.etapa||""; el("prob_perdida").value=j.prob_perdida||"";
    for(var i=0;i<CAMPOS.length;i++){var k=CAMPOS[i];var e=el(k);if(e&&e.tagName!=="SELECT"){e.value=(j[k]==null?"":j[k])}}
    for(var m=0;m<MONTOS.length;m++){var k2=MONTOS[m];var n=Number(j[k2]||0);el(k2).value=n?fmtMonto(n):"";verMonto(k2)}
    el("form").style.display="block";
    if(j.estado_carga==="completado"){showMsg("Este juicio ya fue enviado. Podés seguir editándolo y volver a guardar.",true)}
  }).catch(function(){showMsg("Error de conexión. Reintentá.",false)});
}

function modoNuevo(){
  el("sub").textContent="Cargá un juicio nuevo. Elegí la empresa y completá los datos.";
  fetch(FN+"?meta=1&clave="+encodeURIComponent(NUEVO)).then(function(r){return r.json()}).then(function(d){
    if(d.error){showMsg("Link inválido: "+d.error,false);return}
    el("emp").textContent="Nuevo juicio";
    el("empresa_wrap").style.display="block";
    var sel=el("empresa_id"); sel.innerHTML="";
    var ph=document.createElement("option"); ph.value=""; ph.textContent="— elegí una empresa —"; sel.appendChild(ph);
    for(var i=0;i<d.empresas.length;i++){var o=document.createElement("option");o.value=d.empresas[i].id;o.textContent=d.empresas[i].razon_social;sel.appendChild(o)}
    llenarCat(d.catalogos);
    el("form").style.display="block";
  }).catch(function(){showMsg("Error de conexión. Reintentá.",false)});
}

el("save").onclick=function(){
  var body={};
  if(NUEVO){ body.nuevo=true; body.clave=NUEVO; body.empresa_id=el("empresa_id").value;
    if(!body.empresa_id){showMsg("Elegí una empresa.",false);return} }
  else { body.token=TOKEN; }
  if(!el("actor").value.trim()){showMsg("Ingresá el Actor (Apellido y Nombre).",false);return}
  var anio=el("anio").value.trim();
  if(anio && !(/^\d{4}$/.test(anio) && +anio>=1900 && +anio<=2100)){showMsg("El año tiene que ser de 4 cifras (ej: 2024).",false);el("anio").focus();return}
  for(var i=0;i<CAMPOS.length;i++){var k=CAMPOS[i];var e=el(k);if(e){body[k]=e.value}}
  for(var m=0;m<MONTOS.length;m++){var k2=MONTOS[m];var v=leerMonto(el(k2).value);
    if(v!==null && isNaN(v)){showMsg("Revisá el monto marcado en rojo (ej: 1.500.000,50).",false);verMonto(k2);el(k2).focus();return}
    body[k2]=(v===null?"":String(v))}
  el("save").disabled=true;el("save").textContent="Guardando…";
  fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).then(function(d){
      if(d.ok){
        showMsg("✓ Guardado. ¡Gracias! El estudio ya recibió la información.",true);window.scrollTo(0,0);
        if(NUEVO){ el("form").style.display="none"; }
      } else {showMsg("No se pudo guardar: "+(d.error||"error"),false)}
    }).catch(function(){showMsg("Error de conexión al guardar.",false)})
    .then(function(){el("save").disabled=false;el("save").textContent="Guardar"});
};

if(TOKEN){ modoEditar(); }
else if(NUEVO){ modoNuevo(); }
else { showMsg("Link inválido: falta el parámetro de acceso.",false); }
</script>
</body></html>
